[package]
name = "studio-policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dekopon-policy = "=0.70.0"
dekopon-core = { version = "=0.70.0", default-features = false }
dekopon-capability = "=0.70.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
wasm-bindgen = "=0.2.126"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
